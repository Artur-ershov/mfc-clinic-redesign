<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Лицензии — MFC Clinic</title>
<meta name="robots" content="noindex">
<style>
:root{
  --bg:#F4EFE6;--surface:#FBF8F2;--ink:#2E2A24;--muted:#665F54;--line:#E2DACB;--sageDeep:#6E8782;
}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Manrope',Arial,sans-serif;background:var(--bg);color:var(--ink);line-height:1.55}
.wrap{max-width:900px;margin:0 auto;padding:40px 20px 100px}
a{color:var(--sageDeep)}
.back{display:inline-block;margin-bottom:24px;font-size:14px;color:var(--muted)}
h1{font-size:28px;margin-bottom:6px}
.sub{font-size:14.5px;color:var(--muted);margin-bottom:32px}
.gallery{display:flex;flex-direction:column;gap:24px}
.gallery figure{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px}
.gallery img{display:block;width:100%;height:auto;border-radius:8px}
footer{margin-top:40px;font-size:12.5px;color:var(--muted);border-top:1px solid var(--line);padding-top:16px}
</style>
</head>
<body>
<div class="wrap">
  <a class="back" href="/">← Назад на сайт</a>
  <h1>Лицензии</h1>
  <p class="sub">ООО «Стоматология Азбука Здоровья», лицензия № ЛО-77-01-009398</p>

  <div class="gallery">
    <figure><img src="/assets/license-1.png" alt="Лицензия — страница 1" loading="lazy"></figure>
    <figure><img src="/assets/license-2.png" alt="Лицензия — страница 2" loading="lazy"></figure>
    <figure><img src="/assets/license-3.png" alt="Лицензия — страница 3" loading="lazy"></figure>
  </div>

  <footer>
    ООО «Стоматология Азбука Здоровья» · ИНН 7714940933 · Лицензия № ЛО-77-01-009398
  </footer>
</div>
</body>
</html>
